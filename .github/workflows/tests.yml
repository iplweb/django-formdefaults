name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  test:
    name: py${{ matrix.python-version }} / django ${{ matrix.django }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django: ["4.2", "5.0", "5.1", "5.2"]
        exclude:
          - python-version: "3.13"
            django: "4.2"
          - python-version: "3.13"
            django: "5.0"
        include:
          # Django 6.0 and 6.1 are released; both require Python 3.12+,
          # so they are listed here instead of in the `django` axis
          # (which would need 3.11 exclusions).
          - python-version: "3.12"
            django: "6.0"
          - python-version: "3.13"
            django: "6.0"
          - python-version: "3.12"
            django: "6.1"
          - python-version: "3.13"
            django: "6.1"
          # Django's development branch (6.2.dev) — early warning about
          # upcoming deprecations. Never blocks a PR
          # (continue-on-error above).
          - python-version: "3.13"
            django: "main"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install package and test deps
        env:
          DJANGO_TARGET: ${{ matrix.django }}
        run: |
          uv pip install --system -e ".[test]"
          if [ "$DJANGO_TARGET" = "main" ]; then
            uv pip install --system --prerelease=allow \
              "https://github.com/django/django/archive/main.tar.gz"
          else
            uv pip install --system "Django~=${DJANGO_TARGET}.0"
          fi
      - name: Show resolved versions
        run: uv pip list --system
      - name: Run pytest
        run: pytest -v
